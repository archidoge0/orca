name: "ghav human: E2E"
permissions:
  contents: read
"on":
  push:
    branches:
      - ghav/dev/23286
    paths:
      - .ghav/human
jobs:
  build:
    name: build e2e app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ '' || github.ref }}
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Build E2E outputs
        env:
          VITE_EXPOSE_STORE: "true"
        run: |
          status=0
          pnpm run build:relay &
          relay_pid=$!
          npx electron-vite build --mode e2e || status=1
          pnpm run build:web-from-renderer || status=1
          wait "$relay_pid" || status=1
          exit "$status"
      - name: Upload E2E build output
        uses: actions/upload-artifact@v7
        with:
          name: e2e-build-out
          path: out/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
  prepare-native-cache:
    name: prepare Electron native cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ '' || github.ref }}
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
  changed-e2e:
    name: changed e2e specs
    needs:
      - build
      - prepare-native-cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ '' || github.ref }}
      - name: Install native build and headless UI tools
        run: sudo apt-get update && sudo apt-get install -y build-essential fonts-noto-cjk openssh-client python3 ripgrep xvfb zsh openbox x11-utils
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Download E2E build output
        uses: actions/download-artifact@v8
        with:
          name: e2e-build-out
          path: out/
      - name: Run changed E2E specs
        env:
          TEST_FILES_JSON: ${{ '["tests/e2e/local-ssh-browser-routing.spec.ts", "tests/e2e/ssh-client-hosted-browser-drop-reconnect.spec.ts", "tests/e2e/pty-input-write-queue-ssh.spec.ts", "tests/e2e/ssh-ai-vault-session-history.spec.ts", "tests/e2e/ssh-codex-display-artifacts-repro.spec.ts", "tests/e2e/ssh-cold-activation-restore.spec.ts", "tests/e2e/ssh-cold-hydration-gap-tab-seeding.spec.ts", "tests/e2e/ssh-docker-five-pane-input-under-flood.spec.ts", "tests/e2e/ssh-docker-bulk-open-freeze-repro.spec.ts", "tests/e2e/ssh-docker-half-open-link.spec.ts", "tests/e2e/ssh-docker-quick-open-large-listing.spec.ts", "tests/e2e/ssh-docker-reconnect-pane-restore.spec.ts", "tests/e2e/ssh-docker-relay-stall-credential.spec.ts", "tests/e2e/ssh-docker-resource-accumulation.spec.ts", "tests/e2e/ssh-docker-transport-drop-recovery.spec.ts", "tests/e2e/ssh-external-image-preview.spec.ts", "tests/e2e/ssh-lost-kill-tab-resurrection.spec.ts", "tests/e2e/ssh-pi-compatible-agent-title.spec.ts", "tests/e2e/ssh-port-forward-lifecycle.spec.ts", "tests/e2e/ssh-reconnect-tab-destruction.spec.ts", "tests/e2e/ssh-restart-tab-accumulation.spec.ts", "tests/e2e/ssh-skill-installation.spec.ts", "tests/e2e/ssh-stale-resume-execution-host-scope.spec.ts", "tests/e2e/ssh-terminal-window-wake-stale-grid-repro.spec.ts", "tests/e2e/terminal-inline-images-ssh.spec.ts", "tests/e2e/ssh-docker-watcher-isolation.spec.ts", "tests/e2e/ssh-terminal-parking.spec.ts", "tests/e2e/terminal-retention-budget.spec.ts", "tests/e2e/ssh-startup-exec-readiness.spec.ts", "tests/e2e/paired-startup-exec-readiness.spec.ts"]' }}
        run: |
          # Why the native IME spec is dropped: it test.skip()s itself without
          # ORCA_E2E_NATIVE_IBUS_HANGUL, which this lane cannot set because it has no ibus
          # session. Running it here reported a green skip as coverage.
          mapfile -t TEST_FILES < <(jq -r '.[] | select(
            . != "tests/e2e/local-ssh-browser-routing.spec.ts" and
            . != "tests/e2e/ssh-client-hosted-browser-drop-reconnect.spec.ts" and
            . != "tests/e2e/pty-input-write-queue-ssh.spec.ts" and
            . != "tests/e2e/ssh-ai-vault-session-history.spec.ts" and
            . != "tests/e2e/ssh-codex-display-artifacts-repro.spec.ts" and
            . != "tests/e2e/ssh-cold-activation-restore.spec.ts" and
            . != "tests/e2e/ssh-cold-hydration-gap-tab-seeding.spec.ts" and
            . != "tests/e2e/ssh-docker-five-pane-input-under-flood.spec.ts" and
            . != "tests/e2e/ssh-docker-bulk-open-freeze-repro.spec.ts" and
            . != "tests/e2e/ssh-docker-half-open-link.spec.ts" and
            . != "tests/e2e/ssh-docker-quick-open-large-listing.spec.ts" and
            . != "tests/e2e/ssh-docker-reconnect-pane-restore.spec.ts" and
            . != "tests/e2e/ssh-docker-relay-stall-credential.spec.ts" and
            . != "tests/e2e/ssh-docker-resource-accumulation.spec.ts" and
            . != "tests/e2e/ssh-docker-transport-drop-recovery.spec.ts" and
            . != "tests/e2e/ssh-external-image-preview.spec.ts" and
            . != "tests/e2e/ssh-lost-kill-tab-resurrection.spec.ts" and
            . != "tests/e2e/ssh-pi-compatible-agent-title.spec.ts" and
            . != "tests/e2e/ssh-port-forward-lifecycle.spec.ts" and
            . != "tests/e2e/ssh-reconnect-tab-destruction.spec.ts" and
            . != "tests/e2e/ssh-restart-tab-accumulation.spec.ts" and
            . != "tests/e2e/ssh-skill-installation.spec.ts" and
            . != "tests/e2e/ssh-stale-resume-execution-host-scope.spec.ts" and
            . != "tests/e2e/ssh-terminal-window-wake-stale-grid-repro.spec.ts" and
            . != "tests/e2e/terminal-inline-images-ssh.spec.ts" and
            . != "tests/e2e/ssh-docker-watcher-isolation.spec.ts" and
            . != "tests/e2e/ssh-terminal-parking.spec.ts" and
            . != "tests/e2e/terminal-retention-budget.spec.ts" and
            . != "tests/e2e/ssh-startup-exec-readiness.spec.ts" and
            . != "tests/e2e/paired-startup-exec-readiness.spec.ts" and
            . != "tests/e2e/ssh-browser-network-execution-route.docker.unit.test.ts" and
            . != "tests/e2e/ssh-localhost.spec.ts" and
            . != "tests/e2e/terminal-ibus-hangul-native.spec.ts"
          )' <<<"$TEST_FILES_JSON")
          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "Changed specs are all owned by dedicated lanes."
            exit 0
          fi
          E2E_ENV=(SKIP_BUILD=1 ORCA_E2E_FORWARD_APP_LOGS=1 ORCA_E2E_WEB_CLIENT=1 ORCA_RELAY_PATH="$GITHUB_WORKSPACE/out/relay")
          # Second clause: a spec that reads ORCA_E2E_SSH_DOCKER test.skip()s itself without it, so
          # naming only one trigger silently skipped every other Docker-SSH spec in this lane.
          # The first clause stays because that spec needs Docker without referencing the variable.
          if printf '%s\n' "${TEST_FILES[@]}" | grep -qx 'tests/e2e/ephemeral-vm-provisioned-root.spec.ts' \
            || grep -l 'ORCA_E2E_SSH_DOCKER' "${TEST_FILES[@]}" >/dev/null 2>&1; then
            E2E_ENV+=(ORCA_E2E_SSH_DOCKER=1)
          fi
          E2E_PROJECT_ARGS=()
          if grep -l '@headful' "${TEST_FILES[@]}" >/dev/null; then
            E2E_PROJECT_ARGS+=(--project=electron-headful)
          fi
          xvfb-run --auto-servernum bash .github/scripts/e2e-with-window-manager.sh env "${E2E_ENV[@]}" \
            pnpm run test:e2e "${TEST_FILES[@]}" --workers=1 "${E2E_PROJECT_ARGS[@]}"
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-changed
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
  ssh-docker-watcher-isolation:
    name: ssh docker watcher isolation (${{ matrix.shard }}/4)
    needs:
      - build
      - prepare-native-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ '' || github.ref }}
      - name: Install native build and headless UI tools
        run: sudo apt-get update && sudo apt-get install -y build-essential fonts-noto-cjk openssh-client python3 ripgrep xvfb zsh openbox x11-utils
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Download E2E build output
        uses: actions/download-artifact@v8
        with:
          name: e2e-build-out
          path: out/
      - name: Run Docker SSH watcher isolation E2E
        if: matrix.shard == 1
        run: xvfb-run --auto-servernum bash .github/scripts/e2e-with-window-manager.sh env SKIP_BUILD=1 ORCA_E2E_FORWARD_APP_LOGS=1 pnpm run test:e2e:ssh-docker-watcher-isolation
      - name: Keep watcher-isolation traces
        if: always() && matrix.shard == 1
        run: |
          if [ -d test-results ]; then
            mkdir -p e2e-traces
            mv test-results "e2e-traces/watcher-isolation"
          fi
      - name: Run Docker SSH terminal parking + startup readiness E2E
        if: always() && matrix.shard == 1
        run: xvfb-run --auto-servernum bash .github/scripts/e2e-with-window-manager.sh env SKIP_BUILD=1 ORCA_E2E_FORWARD_APP_LOGS=1 pnpm run test:e2e:ssh-docker-terminal-parking
      - name: Keep terminal-parking traces
        if: always() && matrix.shard == 1
        run: |
          if [ -d test-results ]; then
            mkdir -p e2e-traces
            mv test-results "e2e-traces/terminal-parking"
          fi
      - name: Run remaining Docker SSH E2E
        if: always()
        run: xvfb-run --auto-servernum bash .github/scripts/e2e-with-window-manager.sh env SKIP_BUILD=1 ORCA_E2E_FORWARD_APP_LOGS=1 pnpm run test:e2e:ssh-docker --shard=${{ matrix.shard }}/4
      - name: Keep remaining-ssh-docker traces
        if: always()
        run: |
          if [ -d test-results ]; then
            mkdir -p e2e-traces
            mv test-results "e2e-traces/remaining-ssh-docker"
          fi
      - name: Upload watcher isolation traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-ssh-docker-watcher-isolation-${{ matrix.shard }}
          path: e2e-traces/
          retention-days: 7
          if-no-files-found: ignore
