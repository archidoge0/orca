name: "ghav human: Cloud Verify"
"on":
  push:
    branches:
      - ghav/dev/22457
    paths:
      - .ghav/human
permissions:
  contents: read
defaults:
  run:
    working-directory: cloud
jobs:
  security:
    name: Secret scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Cloud history reachable from HEAD with Gitleaks
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/repo:ro" zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git /repo --config /repo/cloud/.gitleaks.toml --log-opts="HEAD -- cloud :(glob).github/workflows/cloud-*.yml .github/actions/cloud-sql-rollout-lease"
      - name: Scan the single-commit Cloud snapshot with TruffleHog
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/repo:ro" trufflesecurity/trufflehog@sha256:5dc064868ba7933601b5cbaea6954954d524ddd5dc6222a9667acea70068bf7d filesystem /repo --no-verification --fail --include-paths=/repo/cloud/.trufflehog-include-paths.txt --exclude-paths=/repo/cloud/.trufflehog-exclude-paths.txt
