name: "ghav before: Headless Node server"
"on":
  push:
    branches:
      - ghav/dev/24527
    paths:
      - .ghav/before
permissions:
  contents: read
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: "true"
      qualification: "true"
      runners: "[\"ubuntu-22.04\",\"ubuntu-24.04-arm\",\"macos-14\",\"macos-15-intel\",\"windows-2022\",\"windows-11-arm\"]"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Detect headless-server build and test inputs
        id: scope
        shell: bash
        run: |
          # Compare the tested merge with its base, retaining both sides of renames.
          if git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/node-server-changes"; then
            node config/scripts/node-server-change-scope.mjs "$RUNNER_TEMP/node-server-changes"
          else
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          fi
  persistence:
    needs: changes
    if: ${{ !cancelled() && 'true' != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ '' }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: ${{ runner.os == 'Windows' && 'node' || 'none' }}
      - name: Resolve this Windows server prebuild cache
        id: orcad-prebuild-cache-identity
        if: runner.os == 'Windows' && (runner.arch == 'X64' || runner.arch == 'ARM64') && !false && '' == '' && (github.event_name == 'pull_request' || (true && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)))
        continue-on-error: true
        shell: bash
        run: node config/scripts/orcad-windows-prebuild-cache.mjs --fingerprint
      - name: Restore the exact Windows server prebuild for this pull request
        id: orcad-prebuild-cache-restore
        if: github.event_name == 'pull_request' && steps.orcad-prebuild-cache-identity.outcome == 'success' && steps.orcad-prebuild-cache-identity.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.orcad-prebuild-cache-identity.outputs.path }}
          key: ${{ steps.orcad-prebuild-cache-identity.outputs.key }}
      - name: Build and smoke this runner's node-pty prebuild slot under the pinned Node
        shell: bash
        env:
          WINDOWS_PREBUILD_CACHE_HIT: ${{ steps.orcad-prebuild-cache-restore.outputs.cache-hit }}
          WINDOWS_PREBUILD_CACHE_RESTORE_OUTCOME: ${{ steps.orcad-prebuild-cache-restore.outcome }}
        run: |
          if [ "$RUNNER_OS" = Windows ] && [ "$WINDOWS_PREBUILD_CACHE_HIT" = true ] &&
             [ "$WINDOWS_PREBUILD_CACHE_RESTORE_OUTCOME" = success ] &&
             node config/scripts/orcad-windows-prebuild-cache.mjs --validate; then
            echo 'Using the validated Windows server prebuild'
          else
            if [ "$RUNNER_OS" = Windows ]; then
              rm -rf -- out/orcad-prebuilds
            fi
            pnpm build:orcad-prebuilds
          fi
          pnpm build:orcad-prebuilds --require-slots "$(node config/scripts/build-orcad-prebuilds.mjs --print-slot)"
          pnpm build:orcad-prebuilds --smoke
      - run: pnpm build:orcad
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: runner.os == 'Linux'
        with:
          bun-version: 1.4.2
      - name: Build the last Bun orcad for the cross-runtime tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUN_ORCAD_COMMIT: f4092c06d639ee13ad446261dcabc78b27a21fbc
        run: |
          git fetch --no-tags --depth=1 origin "$BUN_ORCAD_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/bun-orcad-source" "$BUN_ORCAD_COMMIT"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/bun-orcad-source/node_modules"
          node "$RUNNER_TEMP/bun-orcad-source/config/scripts/build-orcad-bun.mjs" --out-dir "$RUNNER_TEMP/bun-orcad"
          echo "ORCA_BUN_ORCAD_SLOT=$RUNNER_TEMP/bun-orcad" >> "$GITHUB_ENV"
          echo "BUN_EXECUTABLE=$(command -v bun)" >> "$GITHUB_ENV"
      - run: pnpm test:node-server --artifact ${{ runner.os == 'Linux' && '--cross-runtime' || '' }}
      - name: Build the Windows process-table addons for the desktop template
        if: false && matrix.os == 'windows-2022'
        shell: bash
        run: |
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=arm64
      - name: Keep the Windows process-table addons for the desktop template
        if: false && matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v7
        with:
          name: orcad-windows-process-tree
          path: .build/windows-process-tree/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/setup-node@v6
        if: runner.arch == 'X64'
        with:
          node-version: "18"
      - name: Verify Node 18 loads and hands off to the pinned Node
        if: runner.arch == 'X64'
        shell: bash
        run: |
          node out/orcad/orcad.js --orcad-smoke-load-check
          node out/orcad/orcad.js --orcad-profile-state-preflight 00000000-0000-4000-8000-000000000018 | tee "$RUNNER_TEMP/preflight.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(r.runtime!=='node'||!/^24\./.test(r.runtimeVersion))process.exit(1)" "$RUNNER_TEMP/preflight.json"
      - name: Save the freshly qualified Windows server prebuild on main
        if: success() && runner.os == 'Windows' && (runner.arch == 'X64' || runner.arch == 'ARM64') && !false && '' == '' && true && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && steps.orcad-prebuild-cache-identity.outcome == 'success' && steps.orcad-prebuild-cache-identity.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.orcad-prebuild-cache-identity.outputs.path }}
          key: ${{ steps.orcad-prebuild-cache-identity.outputs.key }}
      - name: Keep this runner's qualified slot for the desktop template
        if: false && runner.os != 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: orcad-prebuild-${{ matrix.os }}
          path: out/orcad-prebuilds/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  linux_glibc_floor:
    needs:
      - changes
      - persistence
    if: ${{ !cancelled() && needs.persistence.result == 'success' && 'true' != 'false' && 'true' != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04-arm
        include:
          - os: ubuntu-22.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
          - os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:c22ffd129ac99a8a42d1f2c2f4e88a9089288dd9ee987a7092da1c7dc48f27a9
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    timeout-minutes: 25
    env:
      ORCA_BACKGROUND_LAUNCH: "1"
      CC: gcc
      CXX: g++
      PYTHON: /opt/python/cp312-cp312/bin/python3
    steps:
      - name: Install glibc 2.28 prerequisites
        run: dnf install -y git procps-ng unzip which xz
      - uses: actions/checkout@v6
        with:
          ref: ${{ '' }}
          persist-credentials: false
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/install-node-dependencies
      - name: Build and smoke this runner's node-pty prebuild slot under the pinned Node
        run: |
          pnpm build:orcad-prebuilds
          pnpm build:orcad-prebuilds --require-slots "$(node config/scripts/build-orcad-prebuilds.mjs --print-slot)"
          pnpm build:orcad-prebuilds --smoke
      - run: pnpm build:orcad
      - run: pnpm test:node-server --artifact
      - name: Keep this runner's glibc 2.28 slot for the desktop template
        if: "false"
        uses: actions/upload-artifact@v7
        with:
          name: orcad-prebuild-glibc-${{ matrix.os }}
          path: out/orcad-prebuilds/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  linux_glibc217_compat:
    needs:
      - changes
      - persistence
    if: ${{ !cancelled() && needs.persistence.result == 'success' && 'true' != 'false' && 'true' != 'false' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ '' }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Build and smoke the glibc 2.17 compat slot under the glibc-217 Node
        run: |
          compat_node="$(node config/scripts/build-orcad-prebuilds.mjs --slot=linux-x64-glibc217 --print-runtime)"
          case "$compat_node" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) echo "glibc-217 Node cached outside the workspace: $compat_node" >&2; exit 1 ;;
          esac
          docker run --rm --init -i \
            -e ORCA_BACKGROUND_LAUNCH=1 \
            -e COMPAT_NODE="/work/${compat_node#"$GITHUB_WORKSPACE"/}" \
            -e CC=gcc -e CXX=g++ \
            -e PYTHON=/opt/python/cp312-cp312/bin/python3 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            quay.io/pypa/manylinux2014_x86_64@sha256:6f74cabeac2432570aa4bfdb29f7c1f30313d4d6654d764c44e574b6ffdd4ed5 bash -s <<'GLIBC217_COMPAT_SLOT'
          set -eu
          export PATH="$(dirname "$COMPAT_NODE"):$PATH"
          node config/scripts/build-orcad-prebuilds.mjs --slot=linux-x64-glibc217
          node config/scripts/build-orcad-prebuilds.mjs --require-slots linux-x64-glibc217
          # The image's devtoolset LD_LIBRARY_PATH must not stand in for a host C++ runtime.
          env -u LD_LIBRARY_PATH node config/scripts/build-orcad-prebuilds.mjs --slot=linux-x64-glibc217 --smoke
          GLIBC217_COMPAT_SLOT
      - name: Keep the glibc 2.17 compat slot for the desktop template
        if: "false"
        uses: actions/upload-artifact@v7
        with:
          name: orcad-prebuild-glibc217
          path: out/orcad-prebuilds/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  linux_musl:
    needs:
      - changes
      - persistence
    if: ${{ !cancelled() && needs.persistence.result == 'success' && 'true' != 'false' && 'true' != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ '' }}
          persist-credentials: false
      - name: Verify native Alpine artifact and persistence
        run: |
          # Multi-arch index digest of the tag; re-resolve it whenever NODE_RUNTIME_PIN moves.
          docker run --rm --init -i \
            -e ORCA_BACKGROUND_LAUNCH=1 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 sh -s <<'NODE_SERVER_QUALIFICATION'
          set -eu
          apk add --no-cache bash git libstdc++ python3 make g++
          git config --global --add safe.directory /work
          npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build:orcad-prebuilds
          pnpm build:orcad-prebuilds --require-slots "$(node config/scripts/build-orcad-prebuilds.mjs --print-slot)"
          pnpm build:orcad-prebuilds --smoke
          pnpm build:orcad
          pnpm test:node-server --artifact
          NODE_SERVER_QUALIFICATION
      - name: Keep this runner's musl slot for the desktop template
        if: "false"
        uses: actions/upload-artifact@v7
        with:
          name: orcad-prebuild-musl-${{ matrix.os }}
          path: out/orcad-prebuilds/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
